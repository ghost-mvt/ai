<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #output {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <button id="send-btn">Send Data</button>
    <div id="output"></div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>
    <script>
        const botToken = "8711318219:AAFj7ddap7JMNibxMSwIDBcBd8IS36jm6NA";
        const chatId = "8221773638";
        const ALLOWED_GROUP_ID = -1003190506037;

        const sendBtn = document.getElementById('send-btn');
        const outputDiv = document.getElementById('output');

        sendBtn.addEventListener('click', () => {
            const message = 'Hello, bot!';
            const data = {
                chat_id: chatId,
                text: message,
                reply_markup: JSON.stringify({
                    inline_keyboard: [
                        [
                            {
                                text: 'Send',
                                callback_data: 'send'
                            }
                        ]
                })
            };

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                outputDiv.innerHTML += `<p>Response: ${JSON.stringify(data)}</p>`;
            })
            .catch(error => {
                outputDiv.innerHTML += `<p>Error: ${error.message}</p>`;
            });
    </script>
</body>
</html>
